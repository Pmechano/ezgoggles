[project]
name = "ezgoggles"
version = "0.1.0"
description = "Help every member of a student group project see the project map: what it does, its stages, and the handoffs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=1.0",
    "jsonschema>=4.20",
]

[project.scripts]
ezgoggles = "ezgoggles.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezgoggles"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
